[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpn-al"
version = "0.1.0"
description = "Active-learning pipeline for cell instance segmentation on bone-marrow trephine WSIs (Ph-negative MPN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "torch>=2.3",
    "timm>=1.0.9",
]

[project.optional-dependencies]
# Hugging Face `transformers` backend (Phikon, Phikon-v2, Midnight, Hibou).
hf = ["transformers>=4.44"]
# Reading tiles straight from WSIs listed in tiles.parquet.
wsi = ["openslide-python>=1.4", "openslide-bin>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
mpn-al-base-models = "mpn_al.embeddings.cli:main_models"
mpn-al-embed = "mpn_al.embeddings.cli:main_extract"
mpn-al-segment = "mpn_al.segmenter.cli:main"
mpn-al-train-head = "mpn_al.training.train_head:main"

# The repository keeps its components directly under src/ (see README). They are
# installed as sub-packages of one importable package, `mpn_al`:
#   src/embeddings -> mpn_al.embeddings, src/segmenter -> mpn_al.segmenter, ...
[tool.setuptools]
packages = [
    "mpn_al",
    "mpn_al.image_backend",
    "mpn_al.embeddings",
    "mpn_al.segmenter",
    "mpn_al.training",
    "mpn_al.evaluation",
    "mpn_al.experiment",
]

[tool.setuptools.package-dir]
mpn_al = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
